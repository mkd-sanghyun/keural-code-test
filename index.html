<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f8fc" />
  <title>좌표를 그리다 — sin playground</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #20243a;
      background: #f7f8fc;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --muted: #858ba3;
      --line: #e9ebf3;
      --purple: #7055e8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; }
    button, input { font: inherit; }
    .page { max-width: 1100px; padding: 32px 28px 48px; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 52px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 750; letter-spacing: -.04em; }
    .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; color: white; background: var(--purple); font-size: 19px; }
    .header-note { color: var(--muted); font-size: 13px; }
    .intro { margin-bottom: 28px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 7px; color: var(--purple); font-size: 12px; font-weight: 750; letter-spacing: .11em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #8b77f1; }
    h1 { margin: 12px 0 8px; font-size: clamp(28px, 4vw, 42px); line-height: 1.15; letter-spacing: -.055em; }
    .intro p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.7; }
    .workspace { display: grid; grid-template-columns: 285px minmax(0, 1fr); gap: 20px; align-items: stretch; }
    .panel { border: 1px solid var(--line); border-radius: 20px; background: white; box-shadow: 0 12px 34px #2c31500a; }
    .controls { padding: 25px 23px; }
    .section-kicker { color: #a1a5b7; font-size: 11px; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
    .controls h2 { margin: 7px 0 21px; font-size: 19px; letter-spacing: -.04em; }
    .field { margin-bottom: 17px; }
    .field-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    label { font-size: 13px; font-weight: 680; }
    .range-label { color: #a0a5b6; font-size: 11px; }
    .input-wrap { position: relative; }
    input[type="number"] { width: 100%; height: 46px; padding: 0 42px 0 13px; border: 1px solid #e5e7f0; border-radius: 11px; outline: none; color: #262a40; background: #fbfbfd; font-size: 15px; transition: border .15s, box-shadow .15s; }
    input[type="number"]:focus { border-color: #a393f4; box-shadow: 0 0 0 3px #7055e81c; }
    .axis-unit { position: absolute; right: 14px; top: 50%; color: #9b9fb0; font-size: 12px; transform: translateY(-50%); pointer-events: none; }
    .hint { min-height: 16px; margin: 5px 0 0; color: #d35468; font-size: 11px; }
    .plot-button { width: 100%; height: 45px; margin-top: 1px; border: 0; border-radius: 11px; color: white; background: var(--purple); font-weight: 700; cursor: pointer; box-shadow: 0 5px 12px #7055e82e; transition: transform .15s, background .15s; }
    .plot-button:hover { background: #6044db; transform: translateY(-1px); }
    .plot-button:active { transform: translateY(0); }
    .formula { margin-top: 19px; padding: 13px 14px; border: 1px solid #eeebff; border-radius: 12px; background: #faf9ff; }
    .formula-title { color: #9994b0; font-size: 10px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
    .formula code { display: block; margin-top: 5px; color: #6148cd; font-size: 16px; font-weight: 650; }
    .chart-panel { min-width: 0; padding: 23px 25px 19px; }
    .chart-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
    .chart-heading h2 { margin: 0; font-size: 17px; letter-spacing: -.035em; }
    .chart-heading p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .live-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; border-radius: 20px; color: #607c6a; background: #eff8f1; font-size: 10px; font-weight: 700; white-space: nowrap; }
    .live-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #60bd7c; }
    .canvas-wrap { position: relative; width: 100%; height: 330px; margin-top: 14px; }
    canvas { display: block; width: 100%; height: 100%; }
    .result-row { display: flex; justify-content: center; align-items: center; gap: 10px; padding-top: 7px; }
    .result-chip { display: flex; align-items: center; gap: 7px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fcfcfe; color: #6d7289; font-size: 12px; }
    .result-chip strong { color: #282c43; font-variant-numeric: tabular-nums; }
    .dot-x, .dot-y { width: 7px; height: 7px; border-radius: 50%; background: #765ce8; }
    .dot-y { background: #24b49a; }
    .footer { margin-top: 19px; color: #a2a6b5; font-size: 11px; text-align: center; }
    @media (max-width: 740px) {
      .page { padding: 23px 17px 34px; }
      header { margin-bottom: 35px; }
      .workspace { grid-template-columns: 1fr; }
      .controls { padding: 21px; }
      .chart-panel { padding: 20px 15px 17px; }
      .canvas-wrap { height: 280px; }
    }
    @media (max-width: 420px) {
      .header-note { font-size: 11px; }
      .result-row { gap: 6px; }
      .result-chip { gap: 5px; padding: 8px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true">∿</span><span>좌표를 그리다</span></div>
      <span class="header-note">간단한 함수 시각화 도구</span>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <span class="eyebrow">SIN PLAYGROUND</span>
      <h1 id="page-title">숫자에 파동을 더해보세요.</h1>
      <p>x와 y 좌표를 입력하면 사인 함수 위에 점으로 표시해 드려요.</p>
    </section>

    <section class="workspace" aria-label="sin 함수 시각화">
      <form class="panel controls" id="coordinate-form" novalidate>
        <span class="section-kicker">YOUR COORDINATE</span>
        <h2>좌표 입력</h2>
        <div class="field">
          <div class="field-head"><label for="x-input">X 좌표</label><span class="range-label">-10 ~ 10</span></div>
          <div class="input-wrap"><input id="x-input" name="x" type="number" min="-10" max="10" step="any" value="2" inputmode="decimal" aria-describedby="x-error" /><span class="axis-unit">x</span></div>
          <p class="hint" id="x-error" aria-live="polite"></p>
        </div>
        <div class="field">
          <div class="field-head"><label for="y-input">Y 좌표</label><span class="range-label">-10 ~ 10</span></div>
          <div class="input-wrap"><input id="y-input" name="y" type="number" min="-10" max="10" step="any" value="0.91" inputmode="decimal" aria-describedby="y-error" /><span class="axis-unit">y</span></div>
          <p class="hint" id="y-error" aria-live="polite"></p>
        </div>
        <button class="plot-button" type="submit">그래프에 표시하기 <span aria-hidden="true">↗</span></button>
        <div class="formula"><span class="formula-title">변환 공식</span><code>y = sin(x)</code></div>
      </form>

      <section class="panel chart-panel" aria-labelledby="chart-title">
        <div class="chart-heading">
          <div><h2 id="chart-title">사인 곡선</h2><p>x를 라디안으로 계산해 곡선에 표시합니다.</p></div>
          <span class="live-badge">실시간 미리보기</span>
        </div>
        <div class="canvas-wrap"><canvas id="chart" role="img" aria-label="-10부터 10까지 사인 곡선과 입력 좌표"></canvas></div>
        <div class="result-row" aria-live="polite">
          <div class="result-chip"><span class="dot-x"></span><span>입력 x</span><strong id="x-value">2.00</strong></div>
          <div class="result-chip"><span class="dot-y"></span><span>sin(x)</span><strong id="sin-value">0.91</strong></div>
          <div class="result-chip"><span class="dot-y"></span><span>입력 y</span><strong id="y-value">0.91</strong></div>
        </div>
      </section>
    </section>
    <p class="footer">점의 색으로 입력한 좌표와 함수의 결과를 구분해 보세요.</p>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('chart');
      const context = canvas.getContext('2d');
      const form = document.getElementById('coordinate-form');
      const xInput = document.getElementById('x-input');
      const yInput = document.getElementById('y-input');
      const state = { x: Number(xInput.value), y: Number(yInput.value) };
      const purple = '#765ce8';
      const teal = '#24b49a';
      const grid = '#edf0f6';
      const text = '#969bae';
      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

      function draw() {
        const rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        context.setTransform(dpr, 0, 0, dpr, 0, 0);
        const width = rect.width;
        const height = rect.height;
        const pad = { left: 43, right: 18, top: 22, bottom: 31 };
        const plotWidth = width - pad.left - pad.right;
        const plotHeight = height - pad.top - pad.bottom;
        const xToPx = x => pad.left + ((x + 10) / 20) * plotWidth;
        const yToPx = y => pad.top + ((1.25 - y) / 2.5) * plotHeight;

        context.clearRect(0, 0, width, height);
        context.font = '11px Inter, Pretendard, sans-serif';
        context.lineWidth = 1;
        for (let y = -1; y <= 1.001; y += 0.5) {
          const py = yToPx(y);
          context.beginPath();
          context.strokeStyle = y === 0 ? '#cfd3df' : grid;
          context.moveTo(pad.left, py);
          context.lineTo(width - pad.right, py);
          context.stroke();
          context.fillStyle = text;
          context.textAlign = 'right';
          context.textBaseline = 'middle';
          context.fillText(y === 0 ? '0' : y.toFixed(1), pad.left - 10, py);
        }
        for (let x = -10; x <= 10; x += 2) {
          const px = xToPx(x);
          context.beginPath();
          context.strokeStyle = x === 0 ? '#cfd3df' : grid;
          context.moveTo(px, pad.top);
          context.lineTo(px, pad.top + plotHeight);
          context.stroke();
          context.fillStyle = text;
          context.textAlign = 'center';
          context.textBaseline = 'top';
          context.fillText(String(x), px, pad.top + plotHeight + 9);
        }

        context.beginPath();
        context.strokeStyle = purple;
        context.lineWidth = 2.6;
        context.lineJoin = 'round';
        for (let i = 0; i <= 500; i++) {
          const x = -10 + (i / 500) * 20;
          const px = xToPx(x);
          const py = yToPx(Math.sin(x));
          if (i === 0) context.moveTo(px, py);
          else context.lineTo(px, py);
        }
        context.stroke();

        const pointX = xToPx(state.x);
        const pointY = yToPx(state.y);
        const curveY = yToPx(Math.sin(state.x));
        context.save();
        context.setLineDash([4, 4]);
        context.lineWidth = 1.2;
        context.strokeStyle = '#bcb2f7';
        context.beginPath();
        context.moveTo(pointX, yToPx(0));
        context.lineTo(pointX, pointY);
        context.stroke();
        context.strokeStyle = '#88d8c8';
        context.beginPath();
        context.moveTo(pointX, curveY);
        context.lineTo(pointX, yToPx(0));
        context.stroke();
        context.restore();

        function point(px, py, color, radius) {
          context.beginPath();
          context.fillStyle = '#fff';
          context.arc(px, py, radius + 3, 0, Math.PI * 2);
          context.fill();
          context.beginPath();
          context.fillStyle = color;
          context.arc(px, py, radius, 0, Math.PI * 2);
          context.fill();
        }
        point(pointX, curveY, teal, 5);
        point(pointX, pointY, purple, 6);
      }

      function showValue(id, value) {
        document.getElementById(id).textContent = Object.is(value, -0) ? '0.00' : value.toFixed(2);
      }

      function validate(input) {
        const value = input.valueAsNumber;
        const error = document.getElementById(`${input.name}-error`);
        if (!Number.isFinite(value)) error.textContent = '숫자를 입력해 주세요.';
        else if (value < -10 || value > 10) error.textContent = '-10부터 10 사이로 입력해 주세요.';
        else error.textContent = '';
        input.setAttribute('aria-invalid', error.textContent ? 'true' : 'false');
        return Number.isFinite(value) && value >= -10 && value <= 10;
      }

      function update() {
        const x = Number(xInput.value);
        const y = Number(yInput.value);
        state.x = clamp(x, -10, 10);
        state.y = clamp(y, -10, 10);
        const result = Math.sin(state.x);
        showValue('x-value', state.x);
        showValue('y-value', state.y);
        showValue('sin-value', result);
        canvas.setAttribute('aria-label', `사인 곡선 위 입력 좌표 (${state.x.toFixed(2)}, ${state.y.toFixed(2)}), sin 결과는 ${result.toFixed(2)}입니다.`);
        draw();
      }

      form.addEventListener('submit', event => {
        event.preventDefault();
        const validX = validate(xInput);
        const validY = validate(yInput);
        if (!validX || !validY) {
          (validX ? yInput : xInput).focus();
          return;
        }
        update();
      });
      for (const input of [xInput, yInput]) {
        input.addEventListener('input', () => {
          validate(input);
          if (validate(xInput) && validate(yInput)) update();
        });
      }
      new ResizeObserver(draw).observe(canvas.parentElement);
      update();
    })();
  </script>
</body>
</html>
